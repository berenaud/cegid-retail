# Publie chaque skill du dépôt sous forme de zip prêt à installer dans Claude.
# Un skill = un dossier <famille>/<outil>/skill/<nom-du-skill>/ contenant SKILL.md.
# Tous les zips sont attachés à la release "skill-latest", avec un lien stable :
#   https://github.com/berenaud/cegid-retail/releases/download/skill-latest/<nom-du-skill>.zip
# Se déclenche à chaque modification d'un skill sur main, ou à la main depuis l'onglet Actions.

name: Package skills

on:
  push:
    branches: [main]
    paths:
      - '**/skill/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire les zips
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          : > "$GITHUB_WORKSPACE/notes.md"
          find . -path ./.git -prune -o -type f -name SKILL.md -path '*/skill/*' -print | sort | while read -r f; do
            dir=$(dirname "$f"); name=$(basename "$dir"); parent=$(dirname "$dir")
            version=$(grep -m1 -oE 'updated: *"?[0-9]{4}-[0-9]{2}-[0-9]{2}' "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
            (cd "$parent" && zip -rq "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
            echo "- **$name** : version $version" >> "$GITHUB_WORKSPACE/notes.md"
            echo "Built $name.zip ($version)"
          done
          echo "" >> "$GITHUB_WORKSPACE/notes.md"
          echo "Télécharger le zip du skill voulu ci-dessous et l'installer dans Claude, sans le décompresser." >> "$GITHUB_WORKSPACE/notes.md"

      - name: Publier la release skill-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete skill-latest --yes --cleanup-tag || true
          gh release create skill-latest dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Skills $(date -u +%Y-%m-%d)" \
            --notes-file notes.md \
            --latest
